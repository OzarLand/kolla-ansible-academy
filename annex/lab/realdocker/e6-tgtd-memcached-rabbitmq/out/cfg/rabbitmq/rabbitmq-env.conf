RABBITMQ_NODENAME=rabbit@vm
RABBITMQ_LOG_BASE=/var/log/kolla/rabbitmq
RABBITMQ_DIST_PORT=18642
RABBITMQ_PID_FILE=/var/lib/rabbitmq/mnesia/rabbitmq.pid
RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS="-kernel inetrc '/etc/rabbitmq/erl_inetrc' +S 2:2 +sbwt none"
RABBITMQ_CTL_ERL_ARGS=""

export ERL_EPMD_ADDRESS=127.0.0.1
export ERL_EPMD_PORT=18641
export ERL_INETRC=/etc/rabbitmq/erl_inetrc
