global
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    log 127.0.0.1:18114 local1
    maxconn 40000
    nbproc 1
    stats socket /var/lib/kolla/haproxy/haproxy.sock group kolla mode 660

defaults
    log global
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 1m
    timeout server 1m
    timeout check 10s
    balance roundrobin
    maxconn 10000

listen stats
   bind 127.0.0.1:18110
   mode http
   stats enable
   stats uri /
   stats refresh 15s
   stats realm Haproxy\ Stats
   stats auth openstack:e1-lab-only

frontend status
    bind 127.0.0.1:18111
    mode http
    monitor-uri /
