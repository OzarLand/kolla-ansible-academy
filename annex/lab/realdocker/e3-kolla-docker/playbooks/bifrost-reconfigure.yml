---
# Imports a task file generated by gen_bifrost.py from roles/bifrost/tasks/reconfigure.yml (see that script).
- hosts: localhost
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - "{{ kolla_ansible_src }}/ansible/group_vars/all.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/rabbitmq/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/heat/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/swift/defaults/main.yml"
    - vars-e3.yml
  tasks:
    - import_tasks: "{{ e3_work }}/bifrost-{{ e3_variant }}.yml"
