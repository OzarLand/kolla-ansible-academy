---
# Prints docker_common_options as templated from the real group_vars/all.yml.
- hosts: localhost
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - "{{ kolla_ansible_src }}/ansible/group_vars/all.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/rabbitmq/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/heat/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/swift/defaults/main.yml"
    - vars-e3.yml
  tasks:
    - name: e3 docker_common_options
      copy:
        dest: "{{ e3_json }}/{{ e3_step }}.json"
        content: "{{ {'docker_common_options': docker_common_options, 'rabbitmq_services.rabbitmq': rabbitmq_services['rabbitmq']} | to_nice_json }}"
