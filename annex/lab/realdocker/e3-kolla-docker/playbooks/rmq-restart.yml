---
# action restart_container with common_options (no role passes graceful_timeout at task level: grep of ansible/roles).
# e3_task_graceful_timeout, when set, is passed as a task-level graceful_timeout (control only).
- hosts: localhost
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - "{{ kolla_ansible_src }}/ansible/group_vars/all.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/rabbitmq/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/heat/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/swift/defaults/main.yml"
    - vars-e3.yml
  tasks:
    - name: e3 restart_container
      vars:
        service: "{{ rabbitmq_services['rabbitmq'] }}"
      become: true
      kolla_docker:
        action: "restart_container"
        common_options: "{{ docker_common_options }}"
        name: "{{ service.container_name }}"
        graceful_timeout: "{{ e3_task_graceful_timeout | default(omit) }}"
