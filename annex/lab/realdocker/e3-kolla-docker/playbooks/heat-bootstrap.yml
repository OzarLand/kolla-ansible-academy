---
# roles/heat/tasks/bootstrap_service.yml verbatim except: container name bootstrap_heat -> e3_bootstrap_heat.
- hosts: localhost
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - "{{ kolla_ansible_src }}/ansible/group_vars/all.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/rabbitmq/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/heat/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/swift/defaults/main.yml"
    - vars-e3.yml
  tasks:
    - name: Running Heat bootstrap container
      vars:
        heat_api: "{{ heat_services['heat-api'] }}"
      become: true
      kolla_docker:
        action: "start_container"
        common_options: "{{ docker_common_options }}"
        detach: False
        environment:
          KOLLA_BOOTSTRAP:
          KOLLA_CONFIG_STRATEGY: "{{ config_strategy }}"
          OS_AUTH_URL: "{{ openstack_auth.auth_url }}"
          OS_IDENTITY_API_VERSION: "3"
          OS_INTERFACE: "internal"
          OS_USERNAME: "{{ openstack_auth.username }}"
          OS_PASSWORD: "{{ openstack_auth.password }}"
          OS_PROJECT_NAME: "{{ openstack_auth.project_name }}"
          OS_REGION_NAME: "{{ openstack_region_name }}"
          OS_CACERT: "{{ openstack_cacert | default(omit) }}"
          HEAT_DOMAIN_ADMIN_PASSWORD: "{{ heat_domain_admin_password }}"
        image: "{{ heat_api.image }}"
        labels:
          BOOTSTRAP:
        name: "e3_bootstrap_heat"
        restart_policy: no
        volumes: "{{ heat_api.volumes|reject('equalto', '')|list }}"
      run_once: True
      delegate_to: "{{ groups[heat_api.group][0] }}"
