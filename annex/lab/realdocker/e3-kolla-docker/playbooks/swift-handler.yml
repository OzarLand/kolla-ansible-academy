---
# CONTRAST ONLY, not in the swift role: what a recreate_or_restart_container handler (the pattern of the other roles)
# would do with the same arguments. The swift role has no such handler.
- hosts: localhost
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - "{{ kolla_ansible_src }}/ansible/group_vars/all.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/rabbitmq/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/heat/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/swift/defaults/main.yml"
    - vars-e3.yml
  tasks:
    - name: e3 hypothetical swift-rsyncd restart handler
      become: true
      kolla_docker:
        action: "recreate_or_restart_container"
        common_options: "{{ docker_common_options }}"
        image: "{{ swift_rsyncd_image_full }}"
        name: "e3_swift_rsyncd"
        volumes:
          - "{{ node_config_directory }}/swift-rsyncd/:{{ container_config_directory }}/:ro"
          - "{{ e3_swift_devices_host_dir }}:{{ swift_devices_mount_point }}:shared"
          - "/etc/localtime:/etc/localtime:ro"
