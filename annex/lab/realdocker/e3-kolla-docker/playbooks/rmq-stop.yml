---
# roles/service-stop/tasks/main.yml with project_services=rabbitmq_services; the kolla filter
# select_services_enabled_and_mapped_to_host and the skip_stop_containers condition are dropped (one host, one service).
- hosts: localhost
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - "{{ kolla_ansible_src }}/ansible/group_vars/all.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/rabbitmq/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/heat/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/swift/defaults/main.yml"
    - vars-e3.yml
  tasks:
    - name: "Stopping rabbitmq containers"
      vars:
        service: "{{ item.value }}"
      become: true
      kolla_docker:
        action: "stop_container"
        common_options: "{{ docker_common_options }}"
        name: "{{ service.container_name }}"
      with_dict: "{{ rabbitmq_services }}"
