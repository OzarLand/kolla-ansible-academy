---
# roles/rabbitmq/tasks/deploy.yml without config.yml (render.py writes the files): check-containers.yml, bootstrap.yml,
# flush_handlers, and the handler task of roles/rabbitmq/tasks/restart_services.yml. Task bodies copied verbatim.
# The handler's follow-up 'Waiting for rabbitmq to start' (rabbitmqctl wait) is omitted:
# the stand-in has no rabbitmqctl.
- hosts: localhost
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - "{{ kolla_ansible_src }}/ansible/group_vars/all.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/rabbitmq/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/heat/defaults/main.yml"
    - "{{ kolla_ansible_src }}/ansible/roles/swift/defaults/main.yml"
    - vars-e3.yml
  handlers:
    - name: Restart rabbitmq container
      vars:
        service_name: "rabbitmq"
        service: "{{ rabbitmq_services[service_name] }}"
      become: true
      kolla_docker:
        action: "recreate_or_restart_container"
        common_options: "{{ docker_common_options }}"
        name: "{{ service.container_name }}"
        image: "{{ service.image }}"
        volumes: "{{ service.volumes }}"
        environment: "{{ service.environment }}"
        dimensions: "{{ service.dimensions }}"
  tasks:
    # roles/rabbitmq/tasks/check-containers.yml
    - name: Check rabbitmq containers
      become: true
      kolla_docker:
        action: "compare_container"
        common_options: "{{ docker_common_options }}"
        name: "{{ item.value.container_name }}"
        image: "{{ item.value.image }}"
        volumes: "{{ item.value.volumes }}"
        environment: "{{ item.value.environment }}"
        dimensions: "{{ item.value.dimensions }}"
      when:
        - inventory_hostname in groups[item.value.group]
        - item.value.enabled | bool
      with_dict: "{{ rabbitmq_services }}"
      notify:
        - Restart rabbitmq container
    # roles/rabbitmq/tasks/bootstrap.yml
    - name: Creating rabbitmq volume
      become: true
      kolla_docker:
        action: "create_volume"
        common_options: "{{ docker_common_options }}"
        name: "{{ project_name }}"
      register: rabbitmq_volume
    - name: Running RabbitMQ bootstrap container
      vars:
        service_name: "rabbitmq"
        service: "{{ rabbitmq_services[service_name] }}"
      become: true
      kolla_docker:
        action: "start_container"
        common_options: "{{ docker_common_options }}"
        detach: False
        environment: "{{ service.bootstrap_environment }}"
        image: "{{ service.image }}"
        labels:
          BOOTSTRAP:
        name: "{{ project_name }}_bootstrap"
        restart_policy: no
        volumes: "{{ service.volumes }}"
      when: rabbitmq_volume is changed
    - name: Flush handlers
      meta: flush_handlers
