# Shared site configuration of the Kolla Ansible Day 2 portal (Zensical,
# native format): what every release has in common.
#
# This file is not given to Zensical. The portal is one site per release of
# versions.toml, plus a small root site (landing page, not-found page, one
# page per planned release). tools/site/releases.py merges this file with the
# settings of a release (docs/<id>.toml: navigation, description) and writes
# the configuration that is built, .zensical.<id>.toml (git-ignored):
#
#   make docs-build                 every release and the root
#   make docs-build RELEASE=<id>    one release and the root
#
# The Markdown under docs/<id>/ is the single source of truth; nothing here
# adds content.

[project]
site_name = "Kolla Ansible Day 2"
# Address of the portal root. The site of a release is published one level
# below, at <site_url><id>/.
site_url = "https://ozarland.github.io/kolla-ansible-day2/"
# Description of the root pages; each release sets its own in docs/<id>.toml.
site_description = "Source-code studies of Kolla-Ansible for Day-2 operations, one per OpenStack release."
site_author = "OzarLand"
# Footer line. The licence is the one of the repository (LICENSE: Apache
# License 2.0); HTML is allowed here.
copyright = 'OzarLand &middot; Licensed under the <a href="https://github.com/OzarLand/kolla-ansible-day2/blob/main/LICENSE">Apache License 2.0</a>'

repo_url = "https://github.com/OzarLand/kolla-ansible-day2"
repo_name = "OzarLand/kolla-ansible-day2"
# "View source" opens the Markdown file on GitHub (content.action.view).
# Prefix up to the repository root: the tooling appends docs/<id>/.
edit_uri = "blob/main/"

# docs_dir, site_dir and nav are not set here: they belong to a release.
# `operations/reconfigure-nova.md` is served as `operations/reconfigure-nova/`.
# Every link the templates and scripts build is relative to the page, so the
# site works under /kolla-ansible-day2/ and unpacked at a web root alike
# (404.html excepted: it is served for any path and uses site_url).
use_directory_urls = true

# Stylesheets, scripts, images and the vendored Mermaid are shared by every
# release: they live once in overrides/assets/ and Zensical copies the static
# files of the theme directory (custom_dir) into each built site.
extra_css = ["assets/stylesheets/portal.css"]
extra_javascript = ["assets/javascripts/portal.js", "assets/javascripts/learning.js"]

[project.theme]
variant = "modern"
language = "en"
custom_dir = "overrides"
# No web fonts: the system font stacks are set in portal.css.
font = false
logo = "assets/images/logo.svg"
favicon = "assets/images/favicon.svg"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.action.view",
  # navigation.instant must stay off: the Mermaid script is added per page
  # in <head> (overrides/main.html) and instant navigation would skip it.
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Icons of the five GitHub alert types (> [!NOTE] …); colours are in portal.css.
[project.theme.icon.admonition]
note = "lucide/info"
tip = "lucide/lightbulb"
important = "lucide/message-square-warning"
warning = "lucide/triangle-alert"
caution = "lucide/octagon-alert"

# Light and dark schemes follow the system preference; the header toggle
# cycles system -> light -> dark. `custom` leaves every colour to portal.css.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
# Remove the "Made with Zensical" footer line; the copyright line stays.
generator = false
# `extra.version` (the theme's own version selector) is left unset on purpose:
# the selector of the header is overrides/partials/releases.html. The tooling
# adds `extra.portal` (the releases of versions.toml) to each built
# configuration.

# The `tags` of a page's front matter are shown under the page and are the
# "Tags" filter of the search dialog. The search itself is the built-in one;
# its only option in Zensical 0.1.2 is `separator`, left at its default,
# which already splits on `-`, `_`, `/` and `.`: `nova_libvirt`, `loop-notify`
# and `--limit` are found by their words. `description` is not indexed.
[project.plugins.tags]

# Broken internal links and anchors are reported, and fail `build --strict`.
# `unresolved_references` must stay off: it treats every bracketed word that
# is not a link, such as the evidence labels [CODE] and [NOT AVAILABLE] or a
# front matter list `tags: [nova]`, as an unresolved reference link.
[project.validation]
invalid_links = true
invalid_link_anchors = true

# Explicit list: nothing is enabled implicitly, so a page renders the same
# constructs here and on github.com.
#
# `attr_list` is left out on purpose: it reads `{…}` at the end of a table
# cell, heading or paragraph as HTML attributes and deletes it from the page
# (a cell ending in `rc ∉ {0,1}` lost that text). The syntax does not exist
# on GitHub, so no page needs it.
[project.markdown_extensions]
admonition = {}
md_in_html = {}
tables = {}
def_list = {}
footnotes = {}
# With portal_mdx (below), lists behave as on GitHub: bullet and numbered
# lists do not merge, and a numbered list keeps its first number.
sane_lists = {}
toc.permalink = true
toc.slugify = { object = "portal_mdx.slug.gh_slugify", kwds = {} }
# No `anchor_linenums`: it puts an empty link on every line of every code
# block (a link without a name for screen readers), and no page links to a line.
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.details = {}
pymdownx.tabbed.alternate_style = true
pymdownx.quotes.callouts = true
# Local extension (tools/site/portal_mdx, found through PYTHONPATH=tools/site):
# GitHub-style nested lists and table pipe escapes, optional line breaks in
# the code spans of tables, evidence chips, GitHub suffixes for repeated
# headings, severity cell classes.
portal_mdx = {}

# Learning journey: the beginner path through the pages of a release, in five
# stages (overrides/journey.html shows it; overrides/main.html adds the step
# bar, the level and the "mark as read" box to the pages it lists;
# assets/javascripts/learning.js keeps the reader's progress in the browser).
# `pages` are page URLs relative to the release, `art` an image of
# assets/images/ozarland/. Every release must have these pages (check_site
# checks the links of the journey page). `level` of a page: its section's
# level (`levels`), unless its front matter sets `level`.
[project.extra.journey]
page = "start/learning-journey/"

[project.extra.journey.levels]
"start/" = "discover"
"concepts/" = "discover"
"reference/glossary/" = "discover"
"operations/" = "practise"
"risk/" = "practise"
"troubleshooting/" = "practise"
"components/" = "master"
"reference/" = "master"

[[project.extra.journey.stages]]
id = "discover"
name = "Discover"
goal = "Get your bearings: how the pages are written, the essentials, and the words used everywhere."
art = "why-map"
alt = "A parchment map on a wooden table traces a route from a book past server towers and check marks to a cloud emblem."
pages = [
  ["start/conventions/", "Conventions and evidence labels"],
  ["start/ten-things-to-know/", "Ten things to know before a production run"],
  ["reference/glossary/", "Glossary"],
  ["start/find-it-fast/", "Find it fast"],
]

[[project.extra.journey.stages]]
id = "understand"
name = "Understand"
goal = "See how Kolla-Ansible is built and what happens, step by step, when a command runs."
art = "concepts"
alt = "A brass orrery made of server racks and cloud forms fills an island library observatory."
pages = [
  ["concepts/repository-architecture/", "Repository architecture"],
  ["concepts/deployment-execution-flow/", "Deployment execution flow"],
  ["concepts/kolla-images/", "Kolla images: start path and one-shot containers"],
  ["concepts/compute-scaling-and-performance/", "Compute scaling and performance"],
]

[[project.extra.journey.stages]]
id = "practise"
name = "Practise"
goal = "Prepare a command before running it: check, predict, then apply one service or one batch at a time."
art = "operations"
alt = "An engineer adjusts brass server machinery at a workbench beside a parchment checklist."
pages = [
  ["operations/pre-execution-checklist/", "Pre-execution checklist"],
  ["operations/predict-a-run/", "Predict and inspect a run"],
  ["operations/reconfigure-a-service/", "Reconfigure a single service"],
  ["operations/controlled-batches/", "Write config first, apply in controlled batches"],
  ["operations/command-quick-lookup/", "Command quick lookup by tag"],
]

[[project.extra.journey.stages]]
id = "judge"
name = "Judge the risks"
goal = "Learn what a tag really touches, why small changes can grow, and which risks and bugs are known."
art = "risk"
alt = "A lighthouse overlooks sailing ships navigating around coastal rocks beneath a bright sky."
pages = [
  ["risk/tags/", "What a tag really executes"],
  ["risk/small-change-large-workload/", "Why a small change creates a large workload"],
  ["risk/risk-register/", "Risk register"],
  ["troubleshooting/known-bugs-and-limitations/", "Known bugs and limitations"],
]

[[project.extra.journey.stages]]
id = "master"
name = "Master"
goal = "Go deeper: how the components depend on each other, the detailed findings, and the limits of what is known."
art = "components"
alt = "A white stone castle with distinct towers is connected by aqueducts carrying glowing messages."
pages = [
  ["components/dependencies/", "Component dependencies"],
  ["components/nova-deep-dive/", "Nova deep dive"],
  ["reference/findings/", "Technical findings"],
  ["reference/method-and-limits/", "Method and limits of the study"],
  ["troubleshooting/what-is-not-known/", "What is not known"],
]
