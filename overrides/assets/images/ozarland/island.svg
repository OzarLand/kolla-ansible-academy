<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">An island city of OzarLand: towers and aqueducts on a cliff above the sea, floating islets, a sailing ship and a navy banner with a cloud emblem</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fd0"/>
      <stop offset=".6" stop-color="#7cb8ee"/>
      <stop offset="1" stop-color="#cfe8fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb7c9"/>
      <stop offset="1" stop-color="#14708f"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d3c4"/>
      <stop offset="1" stop-color="#9c9584"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe6f7"/>
    </linearGradient>
    <clipPath id="frame"><rect width="640" height="400" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="640" height="400" fill="url(#sky)"/>
    <!-- clouds -->
    <g fill="#ffffff" opacity=".92">
      <ellipse cx="110" cy="70" rx="58" ry="20"/><ellipse cx="145" cy="58" rx="36" ry="22"/><ellipse cx="80" cy="62" rx="26" ry="16"/>
      <ellipse cx="470" cy="48" rx="62" ry="18"/><ellipse cx="505" cy="38" rx="34" ry="20"/>
      <ellipse cx="330" cy="105" rx="70" ry="18" opacity=".7"/>
    </g>
    <!-- distant mountains -->
    <path d="M0 230 L70 170 L120 205 L190 150 L260 215 L640 215 L640 240 L0 240Z" fill="#8fb3d6" opacity=".7"/>
    <!-- floating islets -->
    <g>
      <path d="M520 120 h56 l-14 22 l-10 26 l-8 -20 l-12 -10z" fill="#9c9584"/>
      <path d="M518 120 h60 l-4 -6 h-52z" fill="#5f9a3e"/>
      <rect x="538" y="92" width="10" height="24" fill="#efe6d2"/><path d="M536 92 l7 -14 l7 14z" fill="#b55a3a"/>
      <rect x="552" y="100" width="12" height="16" fill="#efe6d2"/><path d="M550 100 l8 -9 l8 9z" fill="#b55a3a"/>
    </g>
    <g>
      <path d="M48 150 h40 l-10 16 l-8 18 l-6 -16 l-8 -8z" fill="#9c9584"/>
      <path d="M46 150 h44 l-3 -5 h-38z" fill="#5f9a3e"/>
      <rect x="60" y="128" width="9" height="18" fill="#efe6d2"/><path d="M58 128 l6 -12 l6 12z" fill="#b55a3a"/>
    </g>
    <!-- sea -->
    <rect y="262" width="640" height="138" fill="url(#sea)"/>
    <g stroke="#e8fbff" stroke-width="2" stroke-linecap="round" opacity=".55">
      <path d="M30 300 h40 M120 330 h50 M60 360 h30 M250 345 h40 M420 372 h50 M540 320 h40"/>
    </g>
    <!-- cliff -->
    <path d="M200 270 C210 210 230 190 260 175 L300 150 L360 140 L420 150 L470 175 C500 195 520 230 530 270Z" fill="url(#cliff)"/>
    <path d="M230 195 C260 170 300 150 360 142 C420 148 460 165 490 190 L470 182 C430 160 390 152 360 152 C320 156 280 170 240 198Z" fill="#5f9a3e"/>
    <!-- waterfalls -->
    <path d="M300 180 h10 v90 h-10z M405 178 h12 v92 h-12z" fill="url(#fall)"/>
    <!-- aqueduct -->
    <g fill="#efe6d2" stroke="#b9ad93" stroke-width="1">
      <path d="M150 230 h110 v-12 h-110z"/>
      <path d="M150 230 v40 h10 v-22 a10 10 0 0 1 20 0 v22 h10 v-22 a10 10 0 0 1 20 0 v22 h10 v-22 a10 10 0 0 1 20 0 v22 h20 v-40z"/>
    </g>
    <!-- city -->
    <g stroke="#b9ad93" stroke-width="1">
      <rect x="282" y="112" width="22" height="40" fill="#efe6d2"/><path d="M280 112 l13 -22 l13 22z" fill="#b55a3a"/>
      <rect x="318" y="86" width="26" height="62" fill="#f6efe0"/><path d="M315 86 l16 -30 l16 30z" fill="#b55a3a"/>
      <rect x="352" y="100" width="22" height="48" fill="#efe6d2"/><path d="M350 100 l13 -22 l13 22z" fill="#b55a3a"/>
      <rect x="384" y="118" width="20" height="32" fill="#f6efe0"/><path d="M382 118 l12 -18 l12 18z" fill="#b55a3a"/>
      <rect x="414" y="130" width="24" height="24" fill="#efe6d2"/><path d="M412 130 h28 l-14 -10z" fill="#c96a45"/>
      <rect x="252" y="140" width="22" height="22" fill="#f6efe0"/><path d="M250 140 h26 l-13 -10z" fill="#c96a45"/>
      <rect x="446" y="150" width="20" height="18" fill="#f6efe0"/><path d="M444 150 h24 l-12 -9z" fill="#c96a45"/>
    </g>
    <g fill="#3a4a63">
      <rect x="326" y="104" width="4" height="7"/><rect x="334" y="104" width="4" height="7"/><rect x="326" y="122" width="4" height="7"/><rect x="334" y="122" width="4" height="7"/>
      <rect x="290" y="126" width="4" height="7"/><rect x="359" y="116" width="4" height="7"/><rect x="391" y="130" width="4" height="7"/>
    </g>
    <!-- harbour bridge -->
    <path d="M380 262 h160 v-10 h-160z" fill="#efe6d2" stroke="#b9ad93"/>
    <path d="M390 262 a12 12 0 0 1 24 0 M430 262 a12 12 0 0 1 24 0 M470 262 a12 12 0 0 1 24 0 M510 262 a12 12 0 0 1 24 0" fill="none" stroke="#b9ad93" stroke-width="2"/>
    <!-- sailing ship -->
    <g>
      <path d="M90 300 h70 l-12 16 h-48z" fill="#7a4a24"/>
      <path d="M123 300 v-56" stroke="#5a3519" stroke-width="3"/>
      <path d="M126 248 c26 10 30 34 28 48 h-28z" fill="#fbf4e4"/>
      <path d="M120 252 c-18 10 -22 30 -20 44 h20z" fill="#f3e6c9"/>
      <path d="M123 244 l16 5 l-16 5z" fill="#1f3a6b"/>
    </g>
    <!-- navy banner with cloud emblem -->
    <g>
      <path d="M572 190 v120" stroke="#5a3519" stroke-width="5" stroke-linecap="round"/>
      <path d="M576 196 h46 v84 l-23 -16 l-23 16z" fill="#1f3a6b"/>
      <path d="M576 196 h46 v6 h-46z" fill="#e2b04a"/>
      <path d="M588 238 a8 8 0 0 1 4 -14 a11 11 0 0 1 20 3 a6 6 0 0 1 0 11z" fill="none" stroke="#f3e3c3" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
