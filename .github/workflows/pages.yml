# Kolla-Ansible Academy moved into OzarLand Academy, module day2:
# https://academy.ozarland.com/day2/ (sources: OzarLand/ozarland-academy).
#
# GitHub Pages does not redirect the site of a moved repository, so this
# repository publishes redirect/: one page per address of the former site
# https://ozarland.github.io/kolla-ansible-academy/, each sending the reader
# to the same page in the portal, and a 404.html for any other address.
# redirect/ is written by tools/site/redirect_site.py of ozarland-academy;
# it is not built here.
name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "redirect/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the redirections to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload the redirections
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: redirect

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
