# Portal: source checks, strict build and built-site checks on every pull
# request and on main; deployment to GitHub Pages from main only.
# One-time repository setup and behaviour before it: tools/site/README.md.
name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "tools/site/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "Makefile"
      - ".github/workflows/docs.yml"
      # Not part of the site, but their links are checked by check_docs.py.
      - "README.md"
      - "CONTRIBUTING.md"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "overrides/**"
      - "tools/site/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Default for every job; the deploy job declares the only additions.
permissions:
  contents: read

# One run per branch or pull request. A newer commit of a pull request
# replaces the run in progress; on main a run is never cancelled, the next
# one waits.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history: prebuild.py reads the last commit date of each page.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      # Not committed (5.5 MB). fetch_vendor.py pins the release and verifies
      # the checksum of the file, restored from this cache or downloaded.
      - name: Cache the vendored Mermaid bundle
        uses: actions/cache@v6
        with:
          path: docs/assets/vendor/mermaid/mermaid.min.js
          key: vendor-mermaid-${{ hashFiles('tools/site/fetch_vendor.py') }}

      - name: Install the build dependencies
        run: make docs-deps

      - name: Check the Markdown sources
        run: make docs-check

      - name: Build the site (strict) and check the result
        run: make docs-build

      # Pull requests (and manual runs on another branch) are never deployed:
      # the built site is kept a few days for inspection.
      - name: Upload the built site for inspection
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 7

      - name: Upload the GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deployment in progress always finishes; the next one waits.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Fails with an explicit message while GitHub Pages is not enabled with
      # the source "GitHub Actions" (see tools/site/README.md).
      - name: Check the GitHub Pages configuration
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
