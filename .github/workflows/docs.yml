# Portal: source checks, strict build and built-site checks on every pull
# request and on main; deployment to GitHub Pages from main only.
# One-time repository setup and behaviour before it: tools/site/README.md.
#
# The `paths` filters below mean that the workflow does not start for a change
# outside them. Do not make the `build` job a required status check while the
# pull_request filter is there: a pull request that touches none of these
# paths would wait for a check that never starts.
name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "tools/site/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "Makefile"
      - ".github/workflows/docs.yml"
      # Not part of the site, but their links are checked by check_docs.py.
      - "README.md"
      - "CONTRIBUTING.md"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "overrides/**"
      - "tools/site/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Default for every job; the deploy job declares the only additions.
permissions:
  contents: read

# One run at a time per branch or pull request. A newer commit of a pull
# request cancels the run in progress. On main a run that has started always
# finishes and the next one waits; only a run that is still waiting is
# replaced by a newer one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history: prebuild.py reads the last commit date of each page.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      # Not committed (5.5 MB). fetch_vendor.py pins the release and verifies
      # the checksum of the file, restored from this cache or downloaded.
      - name: Cache the vendored Mermaid bundle
        uses: actions/cache@v6
        with:
          path: docs/assets/vendor/mermaid/mermaid.min.js
          key: vendor-mermaid-${{ hashFiles('tools/site/fetch_vendor.py') }}

      - name: Install the build dependencies
        run: make docs-deps

      # STRICT=1: the warnings of check_docs.py and check_site.py are errors.
      - name: Check the Markdown sources
        run: make docs-check STRICT=1

      - name: Build the site (strict) and check the result
        run: make docs-build STRICT=1

      # Pull requests (and manual runs on another branch) are never deployed:
      # the built site is kept a few days for inspection.
      - name: Upload the built site for inspection
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 7

      - name: Upload the GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

